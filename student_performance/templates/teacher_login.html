<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Teacher Login</title>
  <link rel="stylesheet" href="teacher_login.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
  margin: 0;
  padding: 0;
  font-family: 'Inter', sans-serif;
  background: linear-gradient(to right, #f5f3ff, #fdf4ff);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.login-container {
  width: 100%;
  max-width: 420px;
  padding: 20px;
}

.login-card {
  background: white;
  border-radius: 16px;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.07);
  padding: 40px 30px;
  text-align: center;
}

.icon-circle {
  background: linear-gradient(to right, #4e54c8, #8f94fb);
  border-radius: 50%;
  color: white;
  font-size: 28px;
  width: 60px;
  height: 60px;
  margin: 0 auto 20px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

h2 {
  margin: 0;
  font-size: 24px;
  color: #111827;
}

.subtitle {
  color: #6b7280;
  margin: 8px 0 24px;
  font-size: 14px;
}

form {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.input-group {
  display: flex;
  align-items: center;
  background: #f9fafb;
  padding: 12px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
}

.input-group i {
  margin-right: 10px;
  color: #9ca3af;
}

.input-group input {
  border: none;
  background: transparent;
  outline: none;
  font-size: 14px;
  width: 100%;
}

.forgot-row {
  text-align: right;
  margin-top: -8px;
  margin-bottom: 4px;
}

.forgot-row a {
  font-size: 13px;
  color: #a21caf;
  text-decoration: none;
}

.forgot-row a:hover {
  text-decoration: underline;
}

.login-btn {
  margin-top: 8px;
  padding: 12px;
  font-size: 16px;
  font-weight: 600;
  background: linear-gradient(to right, #d946ef, #9333ea);
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.3s ease;
}

.login-btn:hover {
  opacity: 0.95;
}

.bottom-text {
  margin-top: 16px;
  font-size: 14px;
  color: #6b7280;
}

.bottom-text a {
  color: #9333ea;
  text-decoration: none;
  font-weight: 500;
}

.bottom-text a:hover {
  text-decoration: underline;
}
.sign-in-btn {
  background: linear-gradient(to right, #4e54c8, #8f94fb); /* Blue gradient */
  color: white;
  border: none;
  padding: 10px 20px;
  border-radius: 25px;
}

  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="icon-circle">
        <i class="fas fa-user"></i>
      </div>
      <h2>Teacher Login</h2>
      <p class="subtitle">Welcome back! Access your teaching portal</p>

      <form method="post">
        <div class="input-group">
          <i class="fas fa-envelope"></i>
          <input type="username" name="username" placeholder="username" required>
        </div>

        <div class="input-group">
          <i class="fas fa-lock"></i>
          <input type="password" name="password" placeholder="Password" required>
        </div>

        <div class="forgot-row">
          <a href="#">Forgot password?</a>
        </div>

       <button class="sign-in-btn">Sign In</button>

      </form>

      <p class="bottom-text">
        New educator? <a href="/teacher/register">Join us here</a>
      </p>

      <p class="bottom-text">
        <a href="/">← Back to Home</a>
      </p>
    </div>
  </div>
</body>
</html>
