<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Teacher Registration</title>
  <link rel="stylesheet" href="teacher_register.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
  margin: 0;
  padding: 0;
  font-family: 'Inter', sans-serif;
  background: linear-gradient(to right, #f3f4f6, #e0e7ff);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.register-container {
  width: 100%;
  max-width: 460px;
  padding: 20px;
}

.form-card {
  background: white;
  border-radius: 16px;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
  padding: 40px 30px;
  text-align: center;
}

.icon-circle {
  background: linear-gradient(to right, #8b5cf6, #ec4899);
  color: white;
  font-size: 28px;
  width: 60px;
  height: 60px;
  margin: 0 auto 20px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

h2 {
  margin: 0;
  font-size: 24px;
  color: #111827;
}

.subtitle {
  color: #6b7280;
  margin: 8px 0 24px;
  font-size: 14px;
}

form {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.form-row {
  display: flex;
  gap: 16px;
}

.input-group {
  flex: 1;
  display: flex;
  align-items: center;
  background: #f9fafb;
  padding: 12px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
}

.input-group.full {
  width: 100%;
}

.input-group i {
  margin-right: 8px;
  color: #9ca3af;
}

.input-group input {
  border: none;
  background: transparent;
  outline: none;
  font-size: 14px;
  width: 100%;
}

.submit-btn {
  margin-top: 10px;
  padding: 12px;
  font-size: 16px;
  font-weight: 600;
  background: linear-gradient(to right, #8b5cf6, #ec4899);
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.3s ease;
}

.submit-btn:hover {
  opacity: 0.95;
}

.bottom-text {
  margin-top: 16px;
  font-size: 14px;
  color: #6b7280;
}

.bottom-text a {
  color: #8b5cf6;
  text-decoration: none;
  font-weight: 500;
}

.bottom-text a:hover {
  text-decoration: underline;
}

  </style>
</head>
<body>
  <div class="register-container">
    <div class="form-card">
      <div class="icon-circle">
        <i class="fas fa-users"></i>
      </div>
      <h2>Teacher Registration</h2>
      <p class="subtitle">Join our community of educators</p>
 {% if error %}<p style="color:red">{{ error }}</p>{% endif %}
      <form method="post">
        <div class="form-row">
          <div class="input-group">
            <i class="fas fa-user"></i>
            <input type="text" name="first_name" placeholder="First Name" required>
          </div>
          <div class="input-group">
            <i class="fas fa-user"></i>
            <input type="text" name="last_name" placeholder="Last Name" required>
          </div>
        </div>

        <div class="input-group full">
          <i class="fas fa-envelope"></i>
          <input type="email" name="email" placeholder="Email Address" required>
        </div>

        <div class="input-group full">
          <i class="fas fa-school"></i>
          <input type="text" name="institution" placeholder="University/School Name" required>
        </div>
<div class="input-group full">
    <i class="fas fa-user"></i>
    <input type="text" name="username" placeholder="Username" required>
  </div>
        <div class="input-group full">
          <i class="fas fa-lock"></i>
          <input type="password" name="password" placeholder="Password" required>
        </div>

        <div class="input-group full">
          <i class="fas fa-lock"></i>
          <input type="password" name="confirm_password" placeholder="Confirm Password" required>
        </div>

        <button type="submit" class="submit-btn">Create Teacher Account</button>
      </form>

      <p class="bottom-text">
        Already have an account?
        <a href="/teacher/login">Sign in here</a>
      </p>
      <p class="bottom-text">
        <a href="/">← Back to Home</a>
      </p>
    </div>
  </div>
</body>
</html>
