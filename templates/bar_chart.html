<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Performance Chart</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='add-student.css') }}">

  <style>

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 1rem;
}

/* Navigation Styles */
.navbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 1000;
  background: rgba(255, 255, 255, 0.8);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(226, 232, 240, 0.6);
}


.nav-container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 1rem;
}

.nav-content {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 4rem;
  gap: 1rem;           
  flex-wrap: nowrap;   
}

.nav-link {
  text-decoration: none;
  color: #475569;
  font-weight: 500;
  transition: color 0.2s ease;
  white-space: nowrap; 
}
.logo {
  display: flex;
  align-items:center;
  gap: 0.75rem;
  text-decoration: none;
  color: inherit;
}

.logo-icon {
  width: 2rem;
  height: 2rem;
  background: linear-gradient(135deg, #7c3aed, #3b82f6);
  border-radius: 0.5rem;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
}

.logo-text {
  font-size: 1.25rem;
  font-weight: 600;
  color: #1e293b;
}

nav {
  display: flex;
  justify-content: space-around; /* or space-between */
  align-items: center;
  gap: 20px; /* optional, adds space between items */
}

.nav-link {
  text-decoration: none;
  color: #475569;
  font-weight: 500;
  transition: color 0.2s ease;
}

.nav-link:hover,
.nav-link.active {
  color: #7c3aed;
}

.nav-buttons {
  display: flex;
  align-items: center;
  gap: 1rem;
}

.btn-ghost {
  background: none;
  border: none;
  color: #475569;
  font-weight: 500;
  padding: 0.5rem 1rem;
  border-radius: 0.375rem;
  cursor: pointer;
  transition: color 0.2s ease;
}

.btn-ghost:hover {
  color: #7c3aed;
}

.btn-primary {
  padding: 0.4rem 0.75rem;
  font-size: 0.9rem;
}

.btn-primary:hover {
  background: linear-gradient(135deg, #6d28d9, #2563eb);
}

.mobile-menu-btn {
  display: none;
  color: #475569;
  cursor: pointer;
}

    h2 {
      text-align: center;
      margin-bottom: 30px;
      color: #333;
    }
    .chart-container {
      width: 95%;
      max-width: 1000px;
      margin: auto;
      background: #fff;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      margin-top:90px;
    }
    nav {
      background-color: #2e3b55;
      padding: 10px;
      text-align: center;
    }
    nav a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
    }
    nav a:hover {
      text-decoration: underline;
    }
    .chart-container {
  padding-top: 120px; 
}

  </style>
</head>
<body>

     <!-- Navigation (for context) -->
    <nav class="navbar">
      <div class="nav-container">
        <div class="nav-content">
          <a href="/" class="logo">
            <div class="logo-icon">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"
                />
                <path d="M22 10v6" />
                <path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5" />
              </svg>
            </div>
            <span class="logo-text">StudentHub</span>
          </a>
          <div class="nav-links">
                       <a href="{{ url_for('teacher_dashboard') }}" class="nav-link">Home</a>
  <a href="{{ url_for('add_student') }}" class="nav-link">Add Student Details</a>
  <a href="{{ url_for('all_students') }}" class="nav-link">All Records</a>
  <a href="{{ url_for('bar_chart') }}" class="nav-link">Bar Chart</a>
   <a href="/allocate_room"  class="nav-link">Allocate Room</a>
          </div>
          <div class="nav-buttons">
            <button class="btn btn-ghost">TEACHER</button>
             <a href="/student_options" class="btn btn-primary">STUDENT</a>

             <a href="/logout"><button class="btn btn-ghost">Logout</button></a>
          </div>
        </div>
      </div>
    </nav>

<div class="chart-container">
  <h2>Total Marks in Each Subject (All Students)</h2>
  <canvas id="barChart"></canvas>
</div>

<script>
  const ctx = document.getElementById('barChart').getContext('2d');
  const barChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: {{ subjects|tojson }},
      datasets: [{
        label: 'Total Marks',
        data: {{ totals|tojson }},
        backgroundColor: [
          'rgba(255, 99, 132, 0.8)',
          'rgba(54, 162, 235, 0.8)',
          'rgba(255, 206, 86, 0.8)',
          'rgba(75, 192, 192, 0.8)',
          'rgba(153, 102, 255, 0.8)'
        ],
        borderColor: [
          'rgba(255, 99, 132, 1)',
          'rgba(54, 162, 235, 1)',
          'rgba(255, 206, 86, 1)',
          'rgba(75, 192, 192, 1)',
          'rgba(153, 102, 255, 1)'
        ],
        borderWidth: 1
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { display: false },
        title: {
          display: true,
          text: 'Total Marks Scored in Each Subject by All Students'
        }
      },
      scales: {
        y: {
          beginAtZero: true,
          title: {
            display: true,
            text: 'Total Marks'
          }
        },
        x: {
          title: {
            display: true,
            text: 'Subjects'
          }
        }
      }
    }
  });
</script>



</body>
</html>
