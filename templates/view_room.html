<!DOCTYPE html>
<html>
<head>
    <title>View Exam Room</title>
    <style>
        /* Base styles */
        body {
            display: flex;
            justify-content: center;  
            align-items: center;      
            min-height: 100vh;        
            margin: 0;                
            background: #f5f7fa;      
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            background: white;
            padding: 30px 25px;
            border-radius: 15px;
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.1);
            max-width: 420px;
            width: 100%;
            text-align: center;
        }

        h2 {
            font-weight: 700;
            color: #6b46c1; /* purple shade */
            margin-bottom: 30px;
            font-size: 1.8rem;
        }

        form input[type="text"] {
            width: 100%;
            padding: 14px 15px;
            border: 2px solid #cbd5e0; /* light gray */
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
            box-sizing: border-box;
        }

        form input[type="text"]:focus {
            border-color: #7c3aed; /* purple */
            outline: none;
            box-shadow: 0 0 8px rgba(124, 58, 237, 0.3);
        }

        form button {
            width: 100%;
            margin-top: 15px;
            padding: 14px 0;
            background: linear-gradient(135deg, #9f7aea, #6b46c1);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.2s ease;
        }

        form button:hover {
            background: linear-gradient(135deg, #6b46c1, #553c9a);
            transform: translateY(-3px);
        }

        .room-info {
            margin-top: 30px;
            font-size: 1rem;
            background: #e9d8fd; /* light purple background */
            padding: 20px;
            border-radius: 12px;
            box-shadow: inset 0 0 8px rgba(124, 58, 237, 0.15);
            text-align: left;
            color: #4c1d95;
        }

        .room-info p {
            margin: 8px 0;
            font-weight: 500;
        }

        .room-info strong {
            color: #6b46c1;
        }

        .not-found {
            margin-top: 30px;
            color: #e53e3e; /* bright red */
            font-weight: 700;
            font-size: 1.1rem;
            background: #fed7d7; /* light red background */
            padding: 15px;
            border-radius: 12px;
            box-shadow: inset 0 0 8px rgba(229, 62, 62, 0.15);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .container {
                padding: 25px 20px;
            }
        }
        .logout-btn {
    width: 100%;
    padding: 14px 0;
    background: #e53e3e; /* bright red */
    border: none;
    border-radius: 10px;
    color: white;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.3s ease, transform 0.2s ease;
}

.logout-btn:hover {
    background: #9b2c2c;
    transform: translateY(-2px);
}

    </style>
</head>
<body>
    <div class="container">
    <h2>View Your Exam Room</h2>
    <form method="POST" action="{{ url_for('view_room_page') }}">
        <input type="text" name="student_id" placeholder="Enter Your Student ID" required>
        <button type="submit">View Room</button>
    </form>

    {% if room %}
        {% if room.room_number %}
            <div class="room-info">
                <p><strong>Name:</strong> {{ room.name }}</p>
                <p><strong>Student ID:</strong> {{ room.id }}</p>
                <p><strong>Block:</strong> {{ room.block_name }}</p>
                <p><strong>Room Number:</strong> {{ room.room_number }}</p>
            </div>
        {% else %}
            <p class="not-found">Room not allocated yet!</p>
        {% endif %}
    {% endif %}

    <!-- Logout button form -->
    <form action="/logout" method="get" style="margin-top: 30px;">
        <button type="submit" class="logout-btn">Logout</button>
    </form>
</div>

</body>
</html>
